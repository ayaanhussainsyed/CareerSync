<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradeScope | CareerSync</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="backgroundCanvas"></canvas>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">CareerSync</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/future-you">Future You</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dna-mapping">Stream To Career DNA Mapping</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leadership-lab">Leadership Lab</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/gradescope">GradeScope</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="content">
        <h1>GradeScope</h1>
        <div class="upload-section">
            <input type="file" id="reportCardInput" accept="image/*">
            <label for="reportCardInput" class="custom-file-upload" id="customUploadButtonText">
                Choose Report Card Image
            </label>
            <button id="uploadButton">Analyze Report Card</button>
        </div>

        <div class="voice-section" style="display: none;"> <button id="startVoiceInput">Ask a Follow-up Question (Voice)</button>
             <div id="voiceInputStatus"></div>
        </div>

        <div id="responseArea">
            Upload your report card image to get a stream recommendation.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
