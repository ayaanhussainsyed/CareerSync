<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <title>Onboarding 🚀 | CareerSync</title>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="container">
    <h1 style="font-family: 'Lora',sans-serif;">Almost there....</h1>
    <br>
    <h2 style="font-family: 'Lora',sans-serif;">What’s one dream you’ve had about your future?</h2>

    <form action="/tell-us-about-yourself" method="POST" class="checkbox-group">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Saving lives or helping people" id="d1" required>
        <label class="form-check-label" for="d1">Saving lives or helping people 🩺</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Changing the world with technology" id="d2" required>
        <label class="form-check-label" for="d2">Changing the world with technology 🌍</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Expressing myself through creativity" id="d3" required>
        <label class="form-check-label" for="d3">Expressing myself through creativity 🎨</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Leading a company or startup" id="d4" required>
        <label class="form-check-label" for="d4">Leading a company or startup 💼</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Traveling the world and learning from it" id="d5" required>
        <label class="form-check-label" for="d5">Traveling the world and learning from it ✈️</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Becoming an expert in something I love" id="d6" required>
        <label class="form-check-label" for="d6">Becoming an expert in something I love 🎓</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Doing something no one’s done before" id="d7" required>
        <label class="form-check-label" for="d7">Doing something no one’s done before 🧑‍🚀</label>
      </div>

      <!-- Other input option -->
      <div class="form-check">
        <input class="form-check-input" type="radio" name="dream" value="Other" id="other" required>
        <label class="form-check-label" for="other">Other</label>
      </div>
      <input type="text" class="other-input" name="other-dream" id="other-dream" placeholder="Tell us your dream..." style="display: none;">

      <a href="/dashboard" style="text-decoration: none; color:black;"><button class="next" type="submit">Next
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
          <path d="M20 12H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 17C15 17 20 13.318 20 12C20 10.682 15 7 15 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button></a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

</body>
</html>
